# Tier 1 CI: lint, format check, and unit tests. Fast, free, and deterministic.
#
# This workflow must never call the Claude API. LLM evals (SPEC §10) belong in a
# separate, manually triggered workflow, not here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Check names: "test (3.11)" and "test (3.13)". Keep stable for branch protection.
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # Empty on purpose so nothing in Tier 1 can reach the Claude API.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
